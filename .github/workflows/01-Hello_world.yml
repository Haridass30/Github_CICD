name: 01-Hello_world

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print Greetings
        run: echo "Hello world"
      
      - name: Print multiple Lines!!
        run: |
          echo "This is the Github action Ubuntu Server"
          echo "This server user is $USER"
          echo "This server storeage is $(df -h)"
          echo "This Reposistory is $GITHUB_REPOSITORY"
          a=10 b=30
          add=$(($a +$b))
          sub=$(($b - $a))
          mul=$(($a * $b))
      - name: Print add,sub,mul
        run: |
          echo "Addition of $a and $b : $add "
          echo "Subtraction of $a and $b : $sub"
          echo "Multiplication of $a and $b : $mul"
