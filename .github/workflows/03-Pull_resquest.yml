name: Pull_Request(PR)
on:
  pull_request:

jobs:
  Pull_request_exp:
    runs-on: ubuntu-latest
    steps:
      - name: This is cmd show for exmaple
        run: |
          echo "Github repo Name : $GITHUB_REPOSITORY"
          echo "Github workspace it a directory : $GITHUB_WORKSPACE"
